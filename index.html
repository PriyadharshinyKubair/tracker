<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6EEF7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Money</title>
<style>
  :root {
    --ink: #F8FAFC;
    --surface: #E6EEF7;
    --raised: #FFFFFF;
    --line: #D5E0EC;
    --paper: #12233A;
    --muted: #64778E;
    --accent: #1B5FA8;
    --deep: #0E4C86;
    --good: #157F5A;
    --alert: #C0392B;
    --mono: ui-monospace, "SF Mono", "Menlo", "Roboto Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: var(--ink); overscroll-behavior-y: none; }
  body { min-height: 100dvh; -webkit-text-size-adjust: 100%; }
  #app {
    background: var(--ink); color: var(--paper); font-family: var(--sans);
    line-height: 1.45; max-width: 560px; margin: 0 auto; min-height: 100dvh;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  #app *, #app *::before, #app *::after { box-sizing: border-box; }
  input, button, select { font-size: 16px; font-family: inherit; }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .boot { padding: 70px 20px; text-align: center; color: var(--muted); font-size: 14px; }

  .panel textarea {
    width: 100%; min-height: 110px; background: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; color: var(--paper); font-family: var(--mono); font-size: 12px;
    padding: 10px; margin-bottom: 8px; resize: vertical;
  }
  .panel textarea:focus { outline: none; border-color: var(--accent); }
  .tabs {
    display: flex; gap: 0; background: var(--surface);
    padding: 0 16px;
  }
  .tab {
    flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); font-size: 14px; padding: 12px 0 10px; cursor: pointer;
  }
  .tab.on { color: var(--deep); font-weight: 700; border-bottom-color: var(--accent); }

  .top { padding: 18px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .eyebrow { margin: 0 0 5px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .bignum {
    margin: 0; font-family: var(--mono); font-size: 38px; font-weight: 700;
    line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--deep);
  }
  .bignum.over { color: var(--alert); }
  .sub { margin: 9px 0 0; font-size: 12.5px; color: var(--muted); }
  .sub b { font-family: var(--mono); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

  .accgrid { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  .acccard {
    flex: 1 1 46%; background: var(--raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 11px; box-shadow: 0 1px 2px rgba(18,35,58,.05);
  }
  .acccard.locked { border-style: dashed; }
  .acccard em { font-style: normal; display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .acccard strong { font-family: var(--mono); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; }
  .acccard strong.neg { color: var(--alert); }
  .lockmark { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }

  .setupbar {
    display: block; width: 100%; margin-top: 12px; background: var(--raised);
    border: 1px solid var(--accent); border-radius: 10px; color: var(--accent);
    font-size: 13.5px; font-weight: 600; padding: 12px; cursor: pointer; min-height: 44px;
  }

  .typearea { padding: 15px 20px 14px; border-bottom: 1px solid var(--line); }
  .modes { display: flex; gap: 6px; margin-bottom: 11px; }
  .mode {
    padding-left: 4px; padding-right: 4px;
    flex: 1; background: var(--raised); border: 1px solid var(--line); border-radius: 9px;
    color: var(--muted); font-size: 13px; padding: 9px; cursor: pointer; min-height: 42px;
  }
  .mode.on { border-color: var(--accent); color: var(--deep); font-weight: 700; }

  .typebox { display: flex; gap: 9px; }
  .typebox input {
    flex: 1; min-width: 0; background: var(--raised); border: 1px solid var(--line);
    border-radius: 11px; color: var(--paper); font-size: 17px; padding: 14px 15px;
    box-shadow: inset 0 1px 2px rgba(18,35,58,.04);
  }
  .typebox input:focus { outline: none; border-color: var(--accent); }
  .typebox input::placeholder { color: #9AAABC; }
  .go {
    background: var(--accent); color: #fff; border: 0; border-radius: 11px;
    font-size: 15px; font-weight: 700; padding: 0 18px; cursor: pointer; min-height: 50px;
  }
  .go.credit { background: var(--good); }
  .go.shift { background: var(--deep); }
  .rowamt.move { color: var(--muted); }
  .go:disabled { opacity: .35; cursor: default; }

  .readout { margin-top: 10px; font-size: 12.5px; color: var(--muted); min-height: 18px; }
  .readout b { font-family: var(--mono); color: var(--paper); font-variant-numeric: tabular-nums; }
  .readout i { font-style: normal; color: var(--accent); font-weight: 600; }

  .chiplabel { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; color: var(--muted); background: var(--raised);
    border: 1px solid var(--line); border-radius: 100px; padding: 7px 12px; cursor: pointer; min-height: 34px;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .chip .rem { font-family: var(--mono); font-size: 11px; font-weight: 600; opacity: .6; font-variant-numeric: tabular-nums; }
  .chip .rem.neg { color: var(--alert); opacity: 1; }
  .chip.on .rem { opacity: .9; color: #fff; }
  .chip.on .rem.neg { color: #FFD6CE; }
  .chip b.rem { font-family: var(--mono); font-size: 10.5px; font-weight: 700; margin-left: 5px; opacity: .75; }
  .chip b.rem.neg { color: var(--alert); opacity: 1; }
  .chip.on b.rem { opacity: .95; }
  .chip.on b.rem.neg { color: #FFD9D2; }
  .inuse { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-width: 42px; text-align: center; }

  .sec { padding: 16px 20px 0; }
  .sechead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .sechead h2 { margin: 0; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

  .row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .rowmain { flex: 1; min-width: 0; }
  .rowtop { font-size: 14px; }
  .rowsub { font-size: 11.5px; color: var(--muted); }
  .rowamt { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
  .rowamt.in { color: var(--good); }
  .del { background: none; border: 0; color: #9AAABC; font-size: 19px; line-height: 1; cursor: pointer; padding: 6px 0 6px 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 0 12px; }

  .bar { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar i.bust { background: var(--alert); }
  .catblock { margin-bottom: 13px; }
  .catline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13.5px; }
  .catline span { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .catline span b { color: var(--paper); font-weight: 700; }
  .catline span.bust b { color: var(--alert); }

  .stats { display: flex; flex-wrap: wrap; gap: 7px; }
  .stat {
    flex: 1 1 46%; background: var(--raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px;
  }
  .stat em { font-style: normal; display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 4px; }
  .stat strong { font-family: var(--mono); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; }
  .stat strong.in { color: var(--good); }
  .stat strong.out { color: var(--alert); }

  .months { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }

  .panel { margin: 14px 20px 0; padding: 15px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; }
  .panel h3 { margin: 0 0 11px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .field { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .field label { flex: 1; font-size: 13px; }
  .field input[type="text"] {
    flex: 1; min-width: 0; background: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; color: var(--paper); font-size: 16px; padding: 9px 10px;
  }
  .field input[type="tel"] {
    width: 106px; background: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    color: var(--paper); font-family: var(--mono); font-size: 16px; text-align: right;
    font-variant-numeric: tabular-nums; padding: 9px 10px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .lockbtn {
    background: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    color: var(--muted); font-size: 15px; cursor: pointer; padding: 8px 10px; min-width: 42px;
  }
  .lockbtn.on { border-color: var(--accent); color: var(--accent); }
  .divider { height: 1px; background: var(--line); margin: 13px 0; }
  .ghost {
    background: var(--ink); border: 1px solid var(--line); color: var(--paper);
    border-radius: 8px; font-size: 13px; padding: 10px 13px; cursor: pointer;
    min-height: 42px; margin: 4px 4px 0 0;
  }
  .ghost.danger { color: var(--alert); }
  .note { font-size: 11.5px; color: var(--muted); margin: 9px 0 0; line-height: 1.55; }

  .hint { margin: 16px 20px 0; font-size: 12px; color: var(--muted); line-height: 1.65; }
  .hint code { font-family: var(--mono); color: var(--deep); background: var(--surface); padding: 2px 6px; border-radius: 5px; }

  #app :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { #app * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="boot">Opening…</div></div>

<script>
(function () {
  var PRE = 'mv1:';
  var CFG = PRE + 'cfg';
  var mk = function (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  var thisMonth = mk(new Date());

  // Everything stays on this device, in this browser. Nothing is sent anywhere.
  var mem = {};
  var hasLS = (function () {
    try {
      window.localStorage.setItem('__t', '1');
      window.localStorage.removeItem('__t');
      return true;
    } catch (e) { return false; }
  })();

  var store = {
    get: function (k) {
      var v = hasLS ? window.localStorage.getItem(k) : (k in mem ? mem[k] : null);
      if (v === null || v === undefined) return Promise.reject(new Error('none'));
      return Promise.resolve({ key: k, value: v });
    },
    set: function (k, v) {
      if (hasLS) window.localStorage.setItem(k, v); else mem[k] = v;
      return Promise.resolve({ key: k, value: v });
    },
    keys: function (prefix) {
      var out = [];
      if (hasLS) {
        for (var i = 0; i < window.localStorage.length; i++) {
          var k = window.localStorage.key(i);
          if (k && k.indexOf(prefix) === 0) out.push(k);
        }
      } else {
        Object.keys(mem).forEach(function (k) { if (k.indexOf(prefix) === 0) out.push(k); });
      }
      return Promise.resolve(out);
    }
  };

  var SEED = {
    accounts: [
      { id: 'spend', name: 'Spending account', locked: false, tags: ['spending', 'spend', 'main', 'gpay', 'upi', 'phonepe'] },
      { id: 'sal',   name: 'Salary account',   locked: false, tags: ['salary', 'sal'] },
      { id: 'sav',   name: 'Savings account',  locked: true,  tags: ['savings', 'saving', 'save', 'sav'] },
      { id: 'cash',  name: 'Cash',             locked: false, tags: ['cash', 'wallet', 'note'] }
    ],
    cats: [
      { id: 'home',  name: 'Home & groceries', limit: 6000, words: ['rent','bill','current','eb','gas','cylinder','grocery','groceries','provision','milk','vegetable','veg','market','maid','water'] },
      { id: 'care',  name: 'Personal care',    limit: 3800, words: ['soap','shampoo','salon','haircut','barber','cream','medicine','medical','tablet','doctor','clothes','dress','shirt','care'] },
      { id: 'fuel',  name: 'Travel',           limit: 2300, words: ['petrol','fuel','bunk','diesel','bus','auto','train','metro','cab','ola','uber','rapido','travel','ticket'] },
      { id: 'out',   name: 'Eating out',       limit: 2000, words: ['tea','coffee','snack','hotel','restaurant','swiggy','zomato','movie','outing','icecream','juice','biryani','party','friends','amazon','flipkart','shopping'] },
      { id: 'lunch', name: 'Lunch',            limit: 1000, words: ['lunch','mess','tiffin','food','meal','canteen','breakfast','dinner'] },
      { id: 'phone', name: 'Phone & subs',     limit: 800,  words: ['recharge','mobile','phone','data','wifi','internet','jio','airtel','netflix','spotify','hotstar','prime'] },
      { id: 'other', name: 'Other',            limit: 0,    words: ['other','misc','emi','loan','gift','transfer'] }
    ],
    lastAcc: 'spend'
  };

  var cfg = null;
  var month = null;          // { open: {accId:n}, entries: [] } for thisMonth
  var view = 'log';
  var mode = 'out';
  var accPick = null, acc2Pick = null, catPick = null, showSet = false;
  var monthList = [], dashKey = thisMonth, dashData = null;
  var app = document.getElementById('app');

  function money(n) {
    var neg = n < 0, s = Math.round(Math.abs(n)).toString();
    var t = s.slice(-3), r = s.slice(0, -3);
    if (r) t = r.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + t;
    return (neg ? '-\u20B9' : '\u20B9') + t;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function label(key) {
    var p = key.split('-');
    return new Date(+p[0], +p[1] - 1, 1).toLocaleString('en-IN', { month: 'long', year: 'numeric' });
  }
  function shortLabel(key) {
    var p = key.split('-');
    return new Date(+p[0], +p[1] - 1, 1).toLocaleString('en-IN', { month: 'short' });
  }
  function daysLeft() {
    var d = new Date();
    return Math.max(1, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate() + 1);
  }
  function daysElapsed(key) {
    if (key !== thisMonth) {
      var p = key.split('-');
      return new Date(+p[0], +p[1], 0).getDate();
    }
    return new Date().getDate();
  }
  function accById(id) { return cfg.accounts.filter(function (a) { return a.id === id; })[0]; }
  function catById(id) { return cfg.cats.filter(function (c) { return c.id === id; })[0]; }

  function closing(rec, accId) {
    return (rec.entries || []).reduce(function (t, e) {
      if (e.dir === 'move') {
        if (e.accId === accId) return t - e.amt;
        if (e.toId === accId) return t + e.amt;
        return t;
      }
      if (e.accId !== accId) return t;
      return t + (e.dir === 'in' ? e.amt : -e.amt);
    }, (rec.open && +rec.open[accId]) || 0);
  }
  function balance(accId) { return closing(month, accId); }
  function spentIn(rec, catId) {
    return (rec.entries || []).reduce(function (t, e) {
      return (e.dir === 'out' && e.catId === catId) ? t + e.amt : t;
    }, 0);
  }

  function parse(text) {
    var clean = text.replace(/,/g, '');
    var m = clean.match(/\d+(\.\d+)?/);
    if (!m) return null;
    var amt = parseFloat(m[0]);
    if (!amt || amt <= 0) return null;
    var rest = clean.replace(m[0], ' ').replace(/^\s*\+\s*/, ' ').replace(/\s+/g, ' ').trim();
    var low = ' ' + rest.toLowerCase() + ' ';
    var found = [];
    cfg.accounts.forEach(function (a) {
      var at = -1, w = null;
      a.tags.forEach(function (tag) {
        var idx = low.indexOf(' ' + tag);
        if (idx > -1 && (at === -1 || idx < at)) { at = idx; w = tag; }
      });
      if (at > -1) found.push({ id: a.id, at: at, word: w });
    });
    found.sort(function (x, y) { return x.at - y.at; });
    var accHit = found.length ? found[0].id : null;
    var accHit2 = found.length > 1 ? found[1].id : null;
    var catHit = null;
    for (var k = 0; k < cfg.cats.length && !catHit; k++) {
      var c = cfg.cats[k];
      for (var n = 0; n < c.words.length; n++) {
        if (low.indexOf(' ' + c.words[n]) > -1) { catHit = c.id; break; }
      }
    }
    var note = rest;
    found.forEach(function (f) {
      note = note.replace(new RegExp('\\b' + f.word + '\\w*', 'i'), '');
    });
    note = note.replace(/\s+/g, ' ').trim();
    return { amt: amt, note: note, accId: accHit, toId: accHit2, catId: catHit };
  }

  async function readMonth(key) {
    try { return JSON.parse((await store.get(PRE + 'm:' + key)).value); }
    catch (e) { return null; }
  }
  async function saveMonth() { try { await store.set(PRE + 'm:' + thisMonth, JSON.stringify(month)); } catch (e) {} }
  async function saveCfg() { try { await store.set(CFG, JSON.stringify(cfg)); } catch (e) {} }

  async function refreshMonthList() {
    var keys = await store.keys(PRE + 'm:');
    monthList = keys.map(function (k) { return k.slice((PRE + 'm:').length); })
                    .filter(function (k) { return /^\d{4}-\d{2}$/.test(k); })
                    .sort().reverse();
    if (monthList.indexOf(thisMonth) === -1) monthList.unshift(thisMonth);
  }

  // Pick up data left behind by the previous version of this app.
  async function rescueOldData() {
    var raw;
    try { raw = (await store.get('acct:cfg:v1')).value; } catch (e) { return false; }
    var oc;
    try { oc = JSON.parse(raw); } catch (e) { return false; }
    if (!oc || !oc.accounts || !oc.accounts.length) return false;

    cfg = {
      accounts: oc.accounts.map(function (a) {
        return { id: a.id, name: a.name, locked: !!a.locked, tags: a.tags || [] };
      }),
      cats: (oc.cats && oc.cats.length) ? oc.cats : JSON.parse(JSON.stringify(SEED.cats)),
      lastAcc: oc.lastAcc || oc.accounts[0].id
    };
    await saveCfg();

    var opens = {};
    oc.accounts.forEach(function (a) { opens[a.id] = +a.open || 0; });

    var keys = await store.keys('acct:log:');
    var months = keys.map(function (k) { return k.slice('acct:log:'.length); })
                     .filter(function (k) { return /^\d{4}-\d{2}$/.test(k); })
                     .sort();
    if (!months.length) months = [thisMonth];

    var carry = opens;
    for (var i = 0; i < months.length; i++) {
      var ents = [];
      try { ents = JSON.parse((await store.get('acct:log:' + months[i])).value) || []; } catch (e) { ents = []; }
      var rec = { open: carry, entries: ents };
      await store.set(PRE + 'm:' + months[i], JSON.stringify(rec));
      var next = {};
      cfg.accounts.forEach(function (a) { next[a.id] = closing(rec, a.id); });
      carry = next;
    }
    if (months.indexOf(thisMonth) === -1) {
      await store.set(PRE + 'm:' + thisMonth, JSON.stringify({ open: carry, entries: [] }));
    }
    try { await store.set('acct:cfg:v1:migrated', '1'); } catch (e) {}
    return true;
  }

  // Never let the app come up with no accounts or no categories.
  function repairCfg() {
    var fixed = false;
    if (!cfg || typeof cfg !== 'object') { cfg = JSON.parse(JSON.stringify(SEED)); fixed = true; }
    if (!Array.isA
